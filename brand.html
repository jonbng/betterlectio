<html lang="da" vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <title vid="4">BetterLectio — Gør Lectio mindre lort.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" vid="5">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" vid="6">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap" rel="stylesheet" vid="7">
    
    <style vid="8">
        :root {
            --bg: #F2F2F0;
            --accent: #FF4500;
            --text: #000000;
            --stroke: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 80px 80px;
        }

        
        .hero-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(-1.5deg);
        }

        h1 {
            font-size: clamp(6rem, 18vw, 15rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.06em;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .title-top {
            color: var(--text);
            z-index: 2;
        }

        .title-bottom {
            background-color: var(--accent);
            color: var(--bg);
            padding: 0 0.2em;
            margin-left: 1.5em;
            margin-top: -0.1em;
            z-index: 1;
        }

        
        .sub-tagline {
            position: absolute;
            bottom: -2rem;
            right: 10%;
            font-size: 1.5rem;
            font-weight: 600;
            max-width: 300px;
            text-align: right;
            transform: rotate(4deg);
            background: var(--text);
            color: var(--bg);
            padding: 0.5rem 1rem;
        }

        
        .download-wrapper {
            margin-top: 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .btn-main {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 1.5rem 4rem;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            text-decoration: none;
        }

        .btn-main:hover {
            background: var(--accent);
            color: var(--bg);
            transform: scale(1.05) rotate(1deg);
        }

        .btn-main svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        
        .metadata {
            position: fixed;
            font-family: monospace;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        .meta-tl { top: 40px; left: 40px; }
        .meta-tr { top: 40px; right: 40px; text-align: right; }
        .meta-bl { bottom: 40px; left: 40px; }
        .meta-br { bottom: 40px; right: 40px; text-align: right; }

        .badge {
            background: var(--text);
            color: var(--bg);
            padding: 2px 6px;
            margin-bottom: 4px;
            display: inline-block;
        }

        
        .rect-deco {
            position: absolute;
            border: 2px solid var(--text);
            pointer-events: none;
        }

        
        @media (max-width: 768px) {
            h1 { font-size: 4rem; }
            .title-bottom { margin-left: 0.5em; }
            .sub-tagline { position: relative; bottom: 0; right: 0; margin-top: 1rem; font-size: 1.2rem; transform: rotate(0); }
            .metadata { display: none; }
            .download-wrapper { margin-top: 3rem; }
            .btn-main { padding: 1rem 2rem; font-size: 1.5rem; }
        }

    </style>
</head>
<body vid="9">

    <div class="bg-grid" vid="10"></div>

    
    <div class="metadata meta-tl" vid="11">
        <div class="badge" vid="12">BUILD_ID: 2025.A1</div><br vid="13">
        DANISH STUDENT PROJECT<br vid="14">
        COPENHAGEN / DK
    </div>

    <div class="metadata meta-tr" vid="15">
        FOR CHROME / FIREFOX / IOS<br vid="16">
        <span style="color: var(--accent)" vid="17">● LIVE SYSTEM STATUS</span>
    </div>

    <div class="metadata meta-bl" vid="18">
        (C) BETTERLECTIO 2025<br vid="19">
        DESIGNED FOR SPEED
    </div>

    <div class="metadata meta-br" vid="20">
        4,129 ACTIVE USERS<br vid="21">
        V.2.0.4 [STABLE]
    </div>

    
    <main class="hero-container" vid="22">
        <h1 vid="23" style="transform: translate(4.96973px, -2.83333px) rotate(-1.5deg);">
            <span class="title-top" vid="24">Better</span>
            <span class="title-bottom" vid="25">Lectio</span>
        </h1>
        
        <p class="sub-tagline" vid="26">Lectio, bare uden alt det lort.</p>

        <div class="download-wrapper" vid="27">
            <a href="#" class="btn-main" vid="28">
                Hent Nu
                <svg viewBox="0 0 24 24" vid="29"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" vid="30"></path></svg>
            </a>
            <div style="font-family: monospace; font-weight: 800; font-size: 0.8rem; margin-top: 0.5rem;" vid="31">
                FREE TO USE — ALWAYS
            </div>
        </div>
    </main>

    
    <div class="rect-deco" style="width: 200px; height: 10px; top: 15%; right: 5%; background: var(--text);" vid="32"></div>
    <div class="rect-deco" style="width: 4px; height: 100px; bottom: 20%; left: 8%; background: var(--accent);" vid="33"></div>
    <div class="rect-deco" style="width: 60px; height: 60px; top: 10%; left: 15%; border-width: 8px;" vid="34"></div>

    <script vid="35">
        
        const h1 = document.querySelector('h1');
        document.addEventListener('mousemove', (e) => {
            const xShift = (e.clientX / window.innerWidth - 0.5) * 10;
            const yShift = (e.clientY / window.innerHeight - 0.5) * 10;
            h1.style.transform = `translate(${xShift}px, ${yShift}px) rotate(-1.5deg)`;
        });

        
        document.querySelector('.btn-main').addEventListener('mousedown', () => {
            document.body.style.backgroundColor = 'var(--text)';
            document.body.style.color = 'var(--bg)';
        });
        document.addEventListener('mouseup', () => {
            document.body.style.backgroundColor = 'var(--bg)';
            document.body.style.color = 'var(--text)';
        });
    </script>

</body></html>
