name: betterlectio
description: BetterLectio - a free, modern Lectio app for Danish students.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  eva_icons_flutter: ^3.1.0
  shared_preferences: ^2.0.15
  lectio_wrapper: ^0.7.8
  flutter_week_view: 1.3.0
  date_format: ^2.0.7
  url_launcher: ^6.3.0
  flutter_bloc: ^9.0.0
  flutter_secure_storage: ^10.0.0-beta.4
  intl: ^0.20.2
  webview_flutter: ^4.2.2
  freezed_annotation: ^2.4.1
  flutter_local_notifications: ^22.0.1
  open_filex: ^4.7.0
  url_launcher_ios: ^6.3.1
  path_provider: ^2.0.15
  flutter_native_splash: ^2.3.1
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2
  rich_text_editor_controller: ^0.0.4
  flutter_svg: ^2.0.9
  community_charts_flutter: ^1.0.2
  page_transition: ^2.1.0
  flutter_speed_dial: ^7.0.0
  aura_box: ^1.0.2
  json_annotation: ^4.9.0
  dots_indicator: ^4.0.1
  intl_translation: ^0.20.0
  step_progress_indicator: ^1.0.2
  dio: ^5.7.0
  android_intent_plus: ^6.0.0
  package_info_plus: ^10.1.0
  workmanager: ^0.9.0+2
  disable_battery_optimizations_latest: ^1.0.0
  upgrader: ^13.5.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  freezed: ^2.0.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0
  very_good_analysis: ^10.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/betterlectio.png"
  min_sdk_android: 21

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_var.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces_var.ttf

  generate: true
  uses-material-design: true
  assets:
    - assets/illustrations/

flutter_native_splash:
  color: "#3362E1"
  image: assets/icons/betterlectio-splash.png
  android_12:
    color: "#3362E1"
    image: assets/icons/betterlectio-splash.png
