name: Release Extension

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      publish_chrome:
        description: 'Publish to Chrome Web Store'
        required: false
        default: true
        type: boolean
      publish_firefox:
        description: 'Publish to Firefox Add-ons'
        required: false
        default: true
        type: boolean
      publish_edge:
        description: 'Publish to Edge Add-ons'
        required: false
        default: true
        type: boolean
      skip_version_bump:
        description: 'Skip version bump (retry a failed store after rotating secrets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          if [ "${{ inputs.skip_version_bump }}" = "true" ]; then
            echo "Skipping version bump; publishing $CURRENT_VERSION"
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${{ github.event.inputs.version_bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # wxt.config.ts no longer carries a `version` — WXT falls back to
          # package.json, so package.json is the single source of truth.

          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and zip extensions
        id: zip
        run: |
          bun run zip
          bun run zip:firefox
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Submit to stores
        id: submit
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob

          trim() {
            printf '%s' "${1-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          export CHROME_EXTENSION_ID="$(trim "${CHROME_EXTENSION_ID-}")"
          export CHROME_CLIENT_ID="$(trim "${CHROME_CLIENT_ID-}")"
          export CHROME_CLIENT_SECRET="$(trim "${CHROME_CLIENT_SECRET-}")"
          export CHROME_REFRESH_TOKEN="$(trim "${CHROME_REFRESH_TOKEN-}")"
          export FIREFOX_EXTENSION_ID="$(trim "${FIREFOX_EXTENSION_ID-}")"
          export FIREFOX_JWT_ISSUER="$(trim "${FIREFOX_JWT_ISSUER-}")"
          export FIREFOX_JWT_SECRET="$(trim "${FIREFOX_JWT_SECRET-}")"
          export EDGE_PRODUCT_ID="$(trim "${EDGE_PRODUCT_ID-}")"
          export EDGE_CLIENT_ID="$(trim "${EDGE_CLIENT_ID-}")"
          export EDGE_API_KEY="$(trim "${EDGE_API_KEY-}")"

          require_one() {
            local label="$1"
            shift
            local files=("$@")
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $label zip, found ${#files[@]}: ${files[*]:-none}"
              ls -la .output || true
              exit 1
            fi
            printf '%s' "${files[0]}"
          }

          ARGS=()
          if [ "${{ inputs.publish_chrome }}" = "true" ]; then
            CHROME_ZIP="$(require_one chrome .output/*-chrome.zip)"
            ARGS+=(--chrome-zip "$CHROME_ZIP")
          fi
          if [ "${{ inputs.publish_firefox }}" = "true" ]; then
            FIREFOX_ZIP="$(require_one firefox .output/*-firefox.zip)"
            SOURCES_ZIP="$(require_one sources .output/*-sources.zip)"
            ARGS+=(--firefox-zip "$FIREFOX_ZIP" --firefox-sources-zip "$SOURCES_ZIP")
          fi
          if [ "${{ inputs.publish_edge }}" = "true" ]; then
            if [ -z "${EDGE_PRODUCT_ID}" ] || [ -z "${EDGE_CLIENT_ID}" ] || [ -z "${EDGE_API_KEY}" ]; then
              echo "::error::Edge secrets missing. Partner Center → Microsoft Edge → Publish API: copy Client ID and a current API key into EDGE_CLIENT_ID / EDGE_API_KEY (keys expire)."
              exit 1
            fi
            EDGE_ZIP="$(require_one chrome .output/*-chrome.zip)"
            ARGS+=(--edge-zip "$EDGE_ZIP")
          fi
          if [ "${#ARGS[@]}" -eq 0 ]; then
            echo "No stores selected for publishing, skipping submit"
            exit 0
          fi

          # Use the repo-locked WXT CLI (0.21+). Do not `npx wxt@latest`.
          bun run submit -- "${ARGS[@]}"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_API_KEY }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_API_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

      - name: Create GitHub Release
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## BetterLectio v${{ steps.version.outputs.version }}

            ### Installation
            - **Chrome**: Install from [Chrome Web Store](https://chromewebstore.google.com/detail/betterlectio/cbopfnaegoknpplkngoppmmomppimhkh) or download the Chrome zip
            - **Firefox**: Install from [Firefox Add-ons](https://addons.mozilla.org/en-US/firefox/addon/betterlectio/) or download the Firefox zip

            ### Manual Installation
            1. Download the appropriate zip file for your browser
            2. Extract the contents
            3. Chrome: Go to `chrome://extensions`, enable Developer Mode, click "Load unpacked"
            4. Firefox: Go to `about:debugging`, click "Load Temporary Add-on"
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
          generate_release_notes: true

      - name: Fail if store submit failed
        if: ${{ always() && steps.submit.outcome == 'failure' }}
        run: |
          echo "::error::One or more store submissions failed. Chrome/Firefox can stay published; retry Edge with skip_version_bump after rotating EDGE_API_KEY in Partner Center → Publish API."
          exit 1
