# Tell the mobile repo to archive and upload the Mac app when an extension
# release tag is pushed. This stays separate from release.yml so a missing
# dispatch token cannot fail a Chrome, Firefox, or Edge publish.

name: Dispatch Safari release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify mobile repo
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch safari-release
        env:
          MOBILE_REPO_DISPATCH_TOKEN: ${{ secrets.MOBILE_REPO_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${MOBILE_REPO_DISPATCH_TOKEN:-}" ]; then
            echo "::error::Missing MOBILE_REPO_DISPATCH_TOKEN. Add a fine-grained PAT with Actions write on Ell1ott/bettermobile-mobile."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to dispatch non-release tag: $TAG"
            exit 1
          fi
          payload="$(jq -n --arg tag "$TAG" '{event_type:"safari-release", client_payload:{tag:$tag}}')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${MOBILE_REPO_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Ell1ott/bettermobile-mobile/dispatches \
            -d "$payload"
          echo "Dispatched safari-release for ${TAG}"
